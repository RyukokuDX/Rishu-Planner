<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学履修登録支援アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>大学履修登録支援アプリ</h1>
    </header>

    <main>
        <div class="container">
            <div id="timetable-container">
                <h2>時間割</h2>
                <table id="timetable">
                    <thead>
                        <tr>
                            <th></th>
                            <th>月</th>
                            <th>火</th>
                            <th>水</th>
                            <th>木</th>
                            <th>金</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JavaScriptで動的に生成 -->
                    </tbody>
                </table>
                <div id="credit-info-panel" class="info-panel">
                    <h3>取得単位数</h3>
                    <div id="credit-breakdown">
                        <!-- 各要件の単位数がここに表示されます -->
                    </div>
                    <p class="total-credits">合計単位数: <span id="total-credits">0</span></p>
                </div>
            </div>
            <div id="lecture-search-container">
                <h2>講義検索</h2>
                <!-- 検索機能は後ほど実装 -->
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
