<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>履修登録シミュレーション</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>履修登録シミュレーション 🗓️</h1>
        </header>

        <main>
            <div class="left-panel">
                <h2>選択済み科目 (<span id="total-credits">0</span>単位)</h2>
                <button id="reset-button">リセット</button>
                <button id="check-conflicts-button">重複チェック</button>
                <ul id="selected-list">
                    </ul>
            </div>

            <div class="timetable-container">
                <h2>時間割</h2>
                <p>コマをクリックして授業を選択してください。</p>
                <table id="timetable">
                    </table>
            </div>

            <div class="right-panel">
                <h2>選択可能科目</h2>
                <div id="available-courses-list">
                    <p class="placeholder">時間割のコマを選択してください。</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const courses = {{ courses|tojson }};
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
